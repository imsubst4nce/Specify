<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Definition of the gradients and effects -->
  <defs>
    <!-- Background Gradient: from vibrant royal purple to rich indigo-blue -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <!-- Metallic/Glossy Overlay Gradient for the letter -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Subtle Drop Shadow for depth -->
    <filter id="smoothShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0c051d" flood-opacity="0.3" />
    </filter>

    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Container with the specified bgGrad gradient and beautiful drop shadow -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" filter="url(#smoothShadow)" />

  <!-- Inner abstract design lines or decorative background circles -->
  <circle cx="256" cy="256" r="180" stroke="rgba(255, 255, 255, 0.04)" stroke-width="4" fill="none" />
  <circle cx="256" cy="256" r="220" stroke="rgba(255, 255, 255, 0.02)" stroke-width="2" fill="none" />

  <!-- Distinctive, sleek, bold architectural Serif/Display Letter "S" for "Specify" -->
  <g filter="url(#iconGlow)">
    <text x="256" y="330" 
          font-family="'Outfit', 'Space Grotesk', 'Inter', 'Helvetica Neue', sans-serif" 
          font-size="250" 
          font-weight="900" 
          fill="url(#textGrad)" 
          text-anchor="middle" 
          letter-spacing="-0.05em">S</text>
  </g>
</svg>
